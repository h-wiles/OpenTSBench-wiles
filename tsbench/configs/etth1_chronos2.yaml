# ETTh1, 96 步预测：Amazon Chronos-2 零样本多变量推理（不训练）
# 首次运行会从 Hugging Face 下载 amazon/chronos-2 权重（120M 参数，约 478 MB）。
name: etth1_chronos2
dataset:
  name: csv
  config:
    path: data/ETT/ETTh1.csv
    split: { type: ett }
    scale: true
task:
  context_length: 96
  horizon: 96
  seasonal_period: 24
models:
  - name: chronos2
    config: { batch_size: 64 }
metrics: [ mse, rmse, mae, mape, smape, mase, r2, pearson ]
