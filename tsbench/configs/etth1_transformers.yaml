# ETTh1, 96 步预测：Transformer 系第三方模型对比 (TSLib Adapter)
name: etth1_transformers
dataset:
  name: csv
  config:
    path: data/ETT/ETTh1.csv
    split: { type: ett }
    scale: true
task:
  context_length: 96
  horizon: 96
  seasonal_period: 24
models:
  - { name: dlinear, config: { epochs: 10, lr: 0.005 } }
  - name: tslib_patchtst
    config: { epochs: 10, lr: 0.001, batch_size: 64, d_model: 128, e_layers: 3, n_heads: 16 }
  - name: tslib_itransformer
    config: { epochs: 10, lr: 0.001, batch_size: 64, d_model: 128, d_ff: 128 }
metrics: [ mse, rmse, mae, mape, smape, mase, r2 ]
